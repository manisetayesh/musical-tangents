<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Tangents - Raw Visualizations</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
<h1>Energy and Popularity of Genre</h1>
<div id="slider_container"></div>
<p>Diameter of discs based on genre popularity <br> Number of rings corresponds to energy level of genre
<br> Changing year functions in website demo, slider is shown here as proof of concept. </p>
<div id="tooltip"></div>
<script src="js/disc.js"></script>
<script src="js/piano.js"></script>
<div id="tempo-controls">
    <label>Song 1: <select id="song1"></select></label>
    <label>Song 2: <select id="song2"></select></label>
</div>
<script src="js/tempo.js"></script>

<section id="genreAnimation-feature">
    <div class="controls">
        <button class="btn btn-play" id="btn-play">&#9654; Play</button>
        <button class="btn" id="btn-reset">&#8634; Reset</button>
        <button class="btn btn-genres" id="btn-genres">&#9836; Genres</button>

        <input type="range" id="year-slider" min="0" max="1" step="1" value="0">
        <span class="year-display" id="year-display">1950</span>
    </div>

    <div class="genre-selector" id="genre-selector">
        <p>Select up to 5 genres (<span id="genre-count">0</span> selected)</p>
        <div class="genre-chips" id="genre-chips"></div>
        <button class="btn" id="btn-apply">Apply &amp; Reset</button>
    </div>

    <div class="legend" id="legend"></div>

    <div id="chart-container">
        <svg id="chart"></svg>
    </div>
</section>
<script src="js/genreAnimation.js"></script>


</body>
</html>
